name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: linux-clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: windows-msvc
            os: windows-latest
          - name: macos-clang
            os: macos-latest
            cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cc }}" ]; then
            export CC="${{ matrix.cc }}" CXX="${{ matrix.cxx }}"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHODHAN_WERROR=ON

      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 2>&1 | tee build.log

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure 2>&1 | tee test.log; exit "${PIPESTATUS[0]}"

      - name: Dependency guard
        if: runner.os == 'Linux'
        run: python3 scripts/check_deps.py --build-dir build --verbose

      # On failure, put the compiler errors or the failing tests into an annotation, which is visible
      # without opening the raw log.
      - name: Failure details
        if: failure()
        shell: bash
        run: |
          set +e +o pipefail
          {
            echo "--- compiler errors (first 40) ---"
            grep -E "error|Error|FAILED|warning C|warning:|see reference to|see declaration" build.log 2>/dev/null | grep -v "Node.js" | head -60
            echo "--- failing tests ---"
            grep -F -e '***Failed' -e '[FAIL]' -e 'CHECK FAILED' -e 'FAILING' -e 'NONDETERMINISTIC' -e 'PROBLEM' -e 'Traceback' -e 'AssertionError' -e 'tests run' -e '  seed ' -e 'SEED' test.log 2>/dev/null | head -60
            echo "--- tail of the test log ---"
            tail -n 25 test.log 2>/dev/null
          } > failure.txt
          msg=$(head -c 6000 failure.txt | sed 's/%/%25/g' | tr -d '\r' | awk '{printf "%s%%0A", $0}')
          echo "::error title=${{ matrix.name }} details::${msg}"

  sanitizers:
    name: linux-asan-ubsan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset debug-sanitizers -DSHODHAN_WERROR=ON

      - name: Build
        run: cmake --build --preset debug-sanitizers --parallel

      - name: Test
        run: ctest --preset debug-sanitizers

  kasauti-unit:
    name: kasauti-python-${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Unit tests (the differential parser test is skipped without the solver)
        working-directory: verify
        run: python -m unittest discover -s tests -t . -v

      - name: Independence check (standard library only, no solver sources)
        run: python scripts/check_verify_independence.py

  kasauti-integration:
    name: linux-ctest-kasauti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHODHAN_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Corpus, exact and float verification, differential parser test, mutations
        run: ctest --test-dir build -R kasauti --output-on-failure

      - name: Independence check
        run: python scripts/check_verify_independence.py

      - name: Dependency guard
        run: python scripts/check_deps.py --build-dir build --verbose

  zlib:
    name: linux-zlib
    runs-on: ubuntu-latest
    env:
      # The CLI test fails if this build cannot read a .gz model.
      SHODHAN_EXPECT_ZLIB: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install zlib
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSHODHAN_WERROR=ON -DSHODHAN_ENABLE_ZLIB=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Read and solve a gzip-compressed model
        run: |
          build/shodhan info tests/models/tiny_lp.mps.gz
          build/shodhan solve tests/models/tiny_lp.mps.gz | grep "Objective:     94"

      - name: CLI test and unit tests
        run: ctest --test-dir build -R "shodhan_cli|shodhan_tests" --output-on-failure

      - name: Dependency guard
        run: python scripts/check_deps.py --build-dir build --verbose
